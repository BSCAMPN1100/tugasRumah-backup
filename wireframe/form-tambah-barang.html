<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Tambah Barang · CatatRezekimu</title>

    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <style>
        /* ----- RESET & GLOBAL ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ----- CARD FORM ----- */
        .form-card {
            max-width: 420px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 20, 40, 0.10);
            padding: 28px 24px 32px;
            transition: box-shadow 0.2s;
        }

        /* ----- HEADER ----- */
        .form-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .form-header .back-icon {
            font-size: 24px;
            line-height: 1;
            cursor: default;
            color: #64748b;
        }

        .form-header h2 {
            font-size: 22px;
            font-weight: 700;
            color: #0b3b2c;
            letter-spacing: -0.3px;
        }

        .form-header .badge {
            margin-left: auto;
            background: #eef2f6;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
            color: #1e293b;
        }

        /* ----- FORM GROUP ----- */
        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            font-weight: 400;
            font-family: 'Inter', sans-serif;
            color: #0f172a;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 16px;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #0b3b2c;
            box-shadow: 0 0 0 4px rgba(11, 59, 44, 0.10);
            background: #ffffff;
        }

        .form-group input::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }

        /* ----- INFO OTOMATIS (stok & harga modal) ----- */
        .auto-info {
            background: #f1f5f9;
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px 24px;
            font-size: 14px;
            border: 1px dashed #dce1e8;
        }

        .auto-info .item {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .auto-info .item .label {
            font-weight: 500;
            color: #64748b;
            font-size: 13px;
        }

        .auto-info .item .value {
            font-weight: 600;
            color: #0b3b2c;
            background: #e6f0ec;
            padding: 0 10px;
            border-radius: 40px;
            font-size: 14px;
        }

        /* ----- TOMBOL AKSI ----- */
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .btn {
            flex: 1;
            padding: 15px 10px;
            border: none;
            border-radius: 16px;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: default;
            transition: background 0.15s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: #0b3b2c;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(11, 59, 44, 0.20);
        }

        .btn-primary:active {
            background: #082f23;
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #1e293b;
        }

        .btn-secondary:active {
            background: #e2e8f0;
        }

        /* ----- CATATAN KHUSUS ----- */
        .note {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 20px;
            text-align: center;
            border-top: 1px solid #eef2f6;
            padding-top: 18px;
            line-height: 1.5;
        }

        .note strong {
            color: #0b3b2c;
            font-weight: 600;
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 480px) {
            .form-card {
                padding: 24px 18px 28px;
                border-radius: 28px;
            }

            .form-header h2 {
                font-size: 19px;
            }

            .btn-group {
                flex-direction: column;
            }

            .auto-info {
                flex-direction: column;
                gap: 8px;
            }
        }

        /* ----- wireframe badge (opsional) ----- */
        .wireframe-badge {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(4px);
            color: #e2e8f0;
            font-size: 11px;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 40px;
            letter-spacing: 0.4px;
            pointer-events: none;
            user-select: none;
            border: 1px solid rgba(255, 255, 255, 0.10);
        }
    </style>
</head>

<body>

    <!-- ====== FORM TAMBAH BARANG ====== -->
    <div class="form-card">

        <!-- Header -->
        <div class="form-header">
            <span class="back-icon">‹</span>
            <h2>Tambah Barang</h2>
            <span class="badge">Admin</span>
        </div>

        <!-- Form (hanya desain) -->
        <form action="#" method="post">

            <!-- Nama Barang -->
            <div class="form-group">
                <label for="nama">Nama Barang</label>
                <input type="text" id="nama" name="nama" placeholder="Contoh: Gula Pasir" value="" />
            </div>

            <!-- Satuan -->
            <div class="form-group">
                <label for="satuan">Satuan</label>
                <input type="text" id="satuan" name="satuan" placeholder="kg, liter, karung, dll." value="" />
            </div>

            <!-- Harga Jual -->
            <div class="form-group">
                <label for="harga_jual">Harga Jual</label>
                <input type="text" id="harga_jual" name="harga_jual" placeholder="Misal: 16000" value="" />
            </div>

            <!-- Info otomatis (stok & harga modal) -->
            <div class="auto-info">
                <span class="item">
                    <span class="label">Stok awal:</span>
                    <span class="value">0</span>
                </span>
                <span class="item">
                    <span class="label">Harga modal:</span>
                    <span class="value">0</span>
                </span>
                <span class="item" style="margin-left:auto; color:#94a3b8; font-size:13px;">
                    ⚡ otomatis
                </span>
            </div>

            <!-- Tombol -->
            <div class="btn-group">
                <button class="btn btn-secondary" type="button">Batal</button>
                <button class="btn btn-primary" type="button">Simpan</button>
            </div>

        </form>

        <!-- Catatan -->
        <div class="note">
            <strong>Perhatian:</strong> Barang baru memiliki stok 0 dan harga modal 0.<br />
            Barang belum bisa dijual sebelum dilakukan pembelian pertama.
        </div>

    </div>

    <!-- Wireframe badge -->
    <div class="wireframe-badge">WIREFRAME · FORM TAMBAH BARANG</div>

</body>
</html>
