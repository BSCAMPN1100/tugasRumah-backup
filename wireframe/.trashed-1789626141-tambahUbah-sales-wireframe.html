<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Sales - CatatRezekimu</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f2f2f2;
        }

        .container {
            width: 390px;
            min-height: 100vh;
            margin: auto;
            background: white;
        }

        .header {
            display: flex;
            align-items: center;
            padding: 18px;
            border-bottom: 1px solid #ccc;
        }

        .back {
            font-size: 22px;
            margin-right: 15px;
        }

        .header h2 {
            margin: 0;
            font-size: 20px;
        }

        .content {
            padding: 20px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #999;
            font-size: 14px;
            background: white;
        }

        .role-info {
            color: #555;
        }

        .button {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            background: white;
            border: 2px solid #222;
            font-weight: bold;
            cursor: pointer;
        }

        .cancel {
            border: 1px solid #555;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="back">←</div>
        <h2>TAMBAH SALES</h2>
    </div>

    <div class="content">

        <div class="section-title">
            DATA SALES
        </div>

        <div class="form-group">
            <label>Nama Lengkap</label>
            <input
                type="text"
                placeholder="Masukkan nama lengkap">
        </div>

        <div class="form-group">
            <label>Username</label>
            <input
                type="text"
                placeholder="Masukkan username">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input
                type="password"
                placeholder="Masukkan password">
        </div>

        <div class="form-group">
            <label>Role</label>
            <select class="role-info">
                <option value="sales">Sales</option>
            </select>
        </div>

        <button class="button">
            SIMPAN
        </button>

        <button class="button cancel">
            BATAL
        </button>

    </div>

</div>

</body>
</html>
