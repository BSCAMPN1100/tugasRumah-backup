<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Sales - CatatRezekimu</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f2f2f2;
        }

        .container {
            width: 390px;
            min-height: 100vh;
            margin: auto;
            background: white;
        }

        .header {
            display: flex;
            align-items: center;
            padding: 18px;
            border-bottom: 1px solid #ccc;
        }

        .back {
            font-size: 22px;
            margin-right: 15px;
        }

        .header h2 {
            margin: 0;
            font-size: 20px;
        }

        .content {
            padding: 20px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .add-button {
            width: 100%;
            padding: 14px;
            border: 2px solid #222;
            background: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .sales-card {
            border: 1px solid #aaa;
            padding: 16px;
            margin-bottom: 15px;
        }

        .sales-name {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .sales-info {
            font-size: 14px;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        .actions button {
            flex: 1;
            padding: 10px;
            background: white;
            border: 1px solid #333;
            cursor: pointer;
            font-weight: bold;
        }

        .delete {
            border-color: #555 !important;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="back">←</div>
        <h2>KELOLA SALES</h2>
    </div>

    <div class="content">

        <div class="section-title">
            DAFTAR SALES
        </div>

        <button class="add-button">
            + TAMBAH SALES
        </button>

        <div class="sales-card">
            <div class="sales-name">
                Budi Santoso
            </div>

            <div class="sales-info">
                Username : budi<br>
                Role : Sales
            </div>

            <div class="actions">
                <button>UBAH</button>
                <button class="delete">HAPUS</button>
            </div>
        </div>

        <div class="sales-card">
            <div class="sales-name">
                Andi Wijaya
            </div>

            <div class="sales-info">
                Username : andi<br>
                Role : Sales
            </div>

            <div class="actions">
                <button>UBAH</button>
                <button class="delete">HAPUS</button>
            </div>
        </div>

        <div class="sales-card">
            <div class="sales-name">
                Siti Rahma
            </div>

            <div class="sales-info">
                Username : siti<br>
                Role : Sales
            </div>

            <div class="actions">
                <button>UBAH</button>
                <button class="delete">HAPUS</button>
            </div>
        </div>

    </div>

</div>

</body>
</html>
