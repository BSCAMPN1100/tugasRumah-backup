<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Sales - CatatRezekimu</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f2f2f2;
        }

        .container {
            width: 390px;
            min-height: 100vh;
            margin: auto;
            background: white;
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid #ccc;
        }

        .app-name {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .greeting {
            font-size: 16px;
        }

        .content {
            padding: 20px;
        }

        .section-title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0 25px;
        }

        .menu-button {
            width: 100%;
            min-height: 90px;
            margin-bottom: 18px;
            background: white;
            border: 2px solid #222;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .logout {
            margin-top: 80px;
            min-height: 50px;
            border: 1px solid #555;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">

        <div class="app-name">
            CATATREZEKIMU
        </div>

        <div class="greeting">
            Halo, Budi!
        </div>

    </div>


    <!-- CONTENT -->
    <div class="content">

        <div class="section-title">
            MENU UTAMA SALES
        </div>


        <!-- CATAT PENJUALAN -->
        <button class="menu-button">
            CATAT PENJUALAN
        </button>


        <!-- RIWAYAT PENJUALAN -->
        <button class="menu-button">
            RIWAYAT PENJUALAN SAYA
        </button>


        <!-- LOGOUT -->
        <button class="menu-button logout">
            LOGOUT
        </button>

    </div>

</div>

</body>
</html>
