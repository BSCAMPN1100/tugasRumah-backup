<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catat Penjualan - CatatRezekimu</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f2f2f2;
        }

        .container {
            width: 390px;
            min-height: 100vh;
            margin: auto;
            background: white;
        }

        .header {
            display: flex;
            align-items: center;
            padding: 18px;
            border-bottom: 1px solid #ccc;
        }

        .back {
            font-size: 22px;
            margin-right: 15px;
        }

        .header h2 {
            margin: 0;
            font-size: 20px;
        }

        .content {
            padding: 20px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .search {
            width: 100%;
            padding: 13px;
            border: 1px solid #999;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .barang-card {
            border: 1px solid #aaa;
            padding: 15px;
            margin-bottom: 15px;
        }

        .barang-name {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .barang-info {
            font-size: 14px;
            line-height: 1.6;
        }

        .pilih-button {
            width: 100%;
            margin-top: 12px;
            padding: 11px;
            background: white;
            border: 1px solid #222;
            font-weight: bold;
            cursor: pointer;
        }

        .cart-button {
            width: 100%;
            margin-top: 10px;
            padding: 14px;
            background: white;
            border: 2px solid #222;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="back">←</div>
        <h2>CATAT PENJUALAN</h2>
    </div>

    <div class="content">

        <div class="section-title">
            DAFTAR BARANG
        </div>

        <input
            type="text"
            class="search"
            placeholder="🔍 Cari barang..."
        >

        <!-- BARANG 1 -->
        <div class="barang-card">

            <div class="barang-name">
                Gula Pasir
            </div>

            <div class="barang-info">
                Rp 12.000 / kg<br>
                Stok tersedia: 100 kg
            </div>

            <button class="pilih-button">
                PILIH
            </button>

        </div>


        <!-- BARANG 2 -->
        <div class="barang-card">

            <div class="barang-name">
                Minyak Goreng
            </div>

            <div class="barang-info">
                Rp 14.000 / liter<br>
                Stok tersedia: 50 liter
            </div>

            <button class="pilih-button">
                PILIH
            </button>

        </div>


        <!-- BARANG 3 -->
        <div class="barang-card">

            <div class="barang-name">
                Beras
            </div>

            <div class="barang-info">
                Rp 17.000 / kg<br>
                Stok tersedia: 80 kg
            </div>

            <button class="pilih-button">
                PILIH
            </button>

        </div>


        <!-- KERANJANG -->
        <button class="cart-button">
            LIHAT KERANJANG
        </button>

    </div>

</div>

</body>
</html>
