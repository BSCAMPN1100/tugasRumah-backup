<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Laporan Keuangan - CatatRezekimu</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f2f2f2;
        }

        .container {
            width: 390px;
            min-height: 100vh;
            margin: auto;
            background: white;
        }

        .header {
            display: flex;
            align-items: center;
            padding: 18px;
            border-bottom: 1px solid #ccc;
        }

        .back {
            font-size: 22px;
            margin-right: 15px;
        }

        .header h2 {
            margin: 0;
            font-size: 20px;
        }

        .content {
            padding: 20px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #999;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: white;
            border: 2px solid #222;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .summary {
            border: 1px solid #aaa;
            padding: 15px;
            margin-bottom: 15px;
        }

        .summary-title {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .summary-value {
            font-size: 20px;
            font-weight: bold;
        }

        .transaction {
            border-bottom: 1px solid #ccc;
            padding: 13px 0;
        }

        .transaction-top {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }

        .transaction-date {
            margin-top: 5px;
            font-size: 13px;
            color: #555;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="back">←</div>
        <h2>LAPORAN KEUANGAN</h2>
    </div>

    <div class="content">

        <div class="section-title">
            PILIH PERIODE
        </div>

        <div class="form-group">
            <label>Dari</label>
            <input type="date" value="2026-08-17">
        </div>

        <div class="form-group">
            <label>Sampai</label>
            <input type="date" value="2026-08-17">
        </div>

        <button>
            TAMPILKAN LAPORAN
        </button>

        <br><br>

        <div class="section-title">
            RINGKASAN
        </div>

        <div class="summary">
            <div class="summary-title">
                TOTAL PENJUALAN
            </div>

            <div class="summary-value">
                Rp 5.000.000
            </div>
        </div>

        <div class="summary">
            <div class="summary-title">
                KEUNTUNGAN KOTOR
            </div>

            <div class="summary-value">
                Rp 750.000
            </div>
        </div>

        <br>

        <div class="section-title">
            RIWAYAT TRANSAKSI
        </div>

        <div class="transaction">
            <div class="transaction-top">
                <span>#001 - Budi</span>
                <span>Rp 2.000.000</span>
            </div>

            <div class="transaction-date">
                17-08-2026
            </div>
        </div>

        <div class="transaction">
            <div class="transaction-top">
                <span>#002 - Andi</span>
                <span>Rp 1.500.000</span>
            </div>

            <div class="transaction-date">
                17-08-2026
            </div>
        </div>

        <div class="transaction">
            <div class="transaction-top">
                <span>#003 - Budi</span>
                <span>Rp 1.500.000</span>
            </div>

            <div class="transaction-date">
                17-08-2026
            </div>
        </div>

    </div>

</div>

</body>
</html>
