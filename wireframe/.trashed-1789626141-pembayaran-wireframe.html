<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran - CatatRezekimu</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eeeeee;
            color: #222;
        }

        .phone {
            width: 390px;
            min-height: 844px;
            margin: 20px auto;
            background: white;
            border: 2px solid #222;
        }

        /* HEADER */
        .header {
            height: 65px;
            border-bottom: 2px solid #222;
            display: flex;
            align-items: center;
            padding: 0 18px;
            gap: 15px;
        }

        .back {
            font-size: 24px;
            cursor: pointer;
        }

        .header h1 {
            font-size: 20px;
        }

        /* CONTENT */
        .content {
            padding: 20px;
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* TRANSACTION SUMMARY */
        .summary {
            border: 2px solid #222;
            padding: 15px;
        }

        .item {
            padding: 10px 0;
            border-bottom: 1px solid #aaa;
        }

        .item:last-child {
            border-bottom: none;
        }

        .item-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .item-detail {
            font-size: 13px;
            display: flex;
            justify-content: space-between;
        }

        /* TOTAL */
        .total-box {
            margin-top: 20px;
            padding: 18px 0;
            border-top: 2px solid #222;
            border-bottom: 2px solid #222;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
        }

        /* PAYMENT */
        .payment-section {
            margin-top: 25px;
        }

        .payment-section label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .payment-input {
            width: 100%;
            height: 50px;
            border: 2px solid #222;
            padding: 0 12px;
            font-size: 18px;
        }

        /* ERROR */
        .error {
            display: none;
            border: 2px solid #222;
            padding: 14px;
            margin-top: 15px;
        }

        .error-title {
            font-weight: bold;
            margin-bottom: 6px;
        }

        .error-text {
            font-size: 14px;
        }

        /* CHANGE */
        .change {
            display: none;
            margin-top: 20px;
            padding: 18px;
            border: 2px solid #222;
        }

        .change-row {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
        }

        /* BUTTON */
        .button-area {
            padding: 0 20px 20px;
        }

        .btn {
            width: 100%;
            height: 48px;
            border: 2px solid #222;
            background: #222;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
        }

        .btn:hover {
            opacity: 0.8;
        }

        .back-btn {
            background: white;
            color: #222;
        }

    </style>
</head>

<body>

<div class="phone">

    <!-- HEADER -->
    <div class="header">

        <div class="back" onclick="kembali()">
            ←
        </div>

        <h1>PEMBAYARAN</h1>

    </div>


    <!-- CONTENT -->
    <div class="content">

        <div class="section-title">
            RINGKASAN TRANSAKSI
        </div>


        <!-- TRANSACTION SUMMARY -->
        <div class="summary">

            <div class="item">

                <div class="item-name">
                    Gula Pasir
                </div>

                <div class="item-detail">
                    <span>10 kg × Rp12.000</span>
                    <span>Rp120.000</span>
                </div>

            </div>


            <div class="item">

                <div class="item-name">
                    Minyak Goreng
                </div>

                <div class="item-detail">
                    <span>5 liter × Rp14.000</span>
                    <span>Rp70.000</span>
                </div>

            </div>

        </div>


        <!-- TOTAL -->
        <div class="total-box">

            <div class="total-row">

                <span>TOTAL BELANJA</span>

                <span id="total">
                    Rp190.000
                </span>

            </div>

        </div>


        <!-- PAYMENT -->
        <div class="payment-section">

            <label for="payment">
                UANG DIBAYAR
            </label>

            <input
                type="number"
                id="payment"
                class="payment-input"
                placeholder="Masukkan jumlah uang"
                oninput="cekPembayaran()"
            >

        </div>


        <!-- ERROR PAYMENT -->
        <div class="error" id="error">

            <div class="error-title">
                ⚠ PEMBAYARAN KURANG
            </div>

            <div class="error-text">
                Uang yang dibayar kurang
                <strong id="kurang">Rp0</strong>.
            </div>

        </div>


        <!-- CHANGE -->
        <div class="change" id="change">

            <div class="change-row">

                <span>KEMBALIAN</span>

                <span id="changeAmount">
                    Rp0
                </span>

            </div>

        </div>

    </div>


    <!-- BUTTONS -->
    <div class="button-area">

        <button
            class="btn"
            id="confirmButton"
            onclick="prosesPembayaran()"
        >
            PROSES PEMBAYARAN
        </button>

        <button
            class="btn back-btn"
            onclick="kembali()"
        >
            KEMBALI KE KERANJANG
        </button>

    </div>

</div>


<script>

    // Total transaksi dari keranjang
    const total = 190000;


    function formatRupiah(angka) {

        return "Rp" + angka.toLocaleString("id-ID");

    }


    function cekPembayaran() {

        const paymentInput =
            document.getElementById("payment");

        const payment =
            parseInt(paymentInput.value) || 0;

        const error =
            document.getElementById("error");

        const change =
            document.getElementById("change");

        const kurang =
            document.getElementById("kurang");

        const changeAmount =
            document.getElementById("changeAmount");


        // Jika pembayaran kurang
        if (payment > 0 && payment < total) {

            const kekurangan =
                total - payment;

            kurang.innerText =
                formatRupiah(kekurangan);

            error.style.display = "block";

            change.style.display = "none";

        }

        // Jika pembayaran cukup
        else if (payment >= total) {

            const kembalian =
                payment - total;

            changeAmount.innerText =
                formatRupiah(kembalian);

            change.style.display = "block";

            error.style.display = "none";

        }

        // Jika belum ada pembayaran
        else {

            error.style.display = "none";

            change.style.display = "none";

        }

    }


    function prosesPembayaran() {

        const payment =
            parseInt(
                document.getElementById("payment").value
            ) || 0;


        // Validasi pembayaran
        if (payment < total) {

            const kekurangan =
                total - payment;

            alert(
                "Pembayaran kurang " +
                formatRupiah(kekurangan)
            );

            return;

        }


        // Hitung kembalian
        const kembalian =
            payment - total;


        /*
         * Pada aplikasi sebenarnya:
         *
         * 1. Simpan transaksi
         * 2. Simpan snapshot harga
         * 3. Kurangi stok
         * 4. Simpan pembayaran
         * 5. Simpan kembalian
         */

        alert(
            "Pembayaran berhasil!\n" +
            "Kembalian: " +
            formatRupiah(kembalian)
        );


        // Nantinya diarahkan ke:
        // transaksi-berhasil.html

    }


    function kembali() {

        alert("Kembali ke keranjang.");

        // Nantinya:
        // window.location.href = "keranjang-penjualan.html";

    }

</script>

</body>
</html>
