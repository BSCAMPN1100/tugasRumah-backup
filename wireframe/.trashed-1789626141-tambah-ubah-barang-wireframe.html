<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wireframe - Tambah Barang</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;

            min-height: 100vh;

            display: flex;
            justify-content: center;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: 100%;
            max-width: 500px;
            min-height: 100vh;

            background: white;

            border: 2px solid #333;

            padding: 20px;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            display: flex;
            align-items: center;

            border-bottom: 2px solid #333;

            padding-bottom: 18px;

            margin-bottom: 30px;
        }

        .back-button {
            border: none;
            background: none;

            font-size: 24px;

            margin-right: 15px;

            cursor: pointer;
        }

        .header h1 {
            font-size: 22px;
        }

        /* =========================
           FORM
        ========================= */

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;

            font-weight: bold;

            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select {

            width: 100%;

            height: 48px;

            border: 2px solid #333;

            padding: 0 12px;

            font-size: 14px;

            background: white;
        }

        /* =========================
           BUTTON
        ========================= */

        .button-container {
            margin-top: 30px;
        }

        .save-button,
        .cancel-button {

            width: 100%;

            height: 48px;

            border: 2px solid #333;

            font-weight: bold;

            cursor: pointer;

            margin-bottom: 12px;
        }

        .save-button {
            background: #eee;
        }

        .cancel-button {
            background: white;
        }

        .save-button:hover,
        .cancel-button:hover {
            background: #ddd;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 500px) {

            .container {
                border: none;
            }

        }

    </style>
</head>

<body>

    <main class="container">

        <!-- =========================
             HEADER
        ========================= -->

        <header class="header">

            <button class="back-button">
                ←
            </button>

            <h1>
                TAMBAH BARANG
            </h1>

        </header>


        <!-- =========================
             FORM BARANG
        ========================= -->

        <form>

            <!-- NAMA -->
            <div class="form-group">

                <label for="nama">
                    Nama Barang
                </label>

                <input
                    type="text"
                    id="nama"
                    name="nama"
                    placeholder="Contoh: Gula Pasir"
                >

            </div>


            <!-- SATUAN -->
            <div class="form-group">

                <label for="satuan">
                    Satuan
                </label>

                <select
                    id="satuan"
                    name="satuan"
                >

                    <option value="">
                        Pilih satuan
                    </option>

                    <option value="kg">
                        kg
                    </option>

                    <option value="liter">
                        liter
                    </option>

                    <option value="karung">
                        karung
                    </option>

                    <option value="kardus">
                        kardus
                    </option>

                </select>

            </div>


            <!-- HARGA MODAL -->
            <div class="form-group">

                <label for="harga_modal">
                    Harga Modal
                </label>

                <input
                    type="number"
                    id="harga_modal"
                    name="harga_modal"
                    placeholder="Rp"
                >

            </div>


            <!-- HARGA JUAL -->
            <div class="form-group">

                <label for="harga_jual">
                    Harga Jual
                </label>

                <input
                    type="number"
                    id="harga_jual"
                    name="harga_jual"
                    placeholder="Rp"
                >

            </div>


            <!-- STOK -->
            <div class="form-group">

                <label for="stok">
                    Stok Awal
                </label>

                <input
                    type="number"
                    id="stok"
                    name="stok"
                    min="0"
                    placeholder="0"
                >

            </div>


            <!-- BUTTON -->
            <div class="button-container">

                <button
                    type="submit"
                    class="save-button">

                    SIMPAN

                </button>


                <button
                    type="button"
                    class="cancel-button">

                    BATAL

                </button>

            </div>

        </form>

    </main>

</body>

</html>
