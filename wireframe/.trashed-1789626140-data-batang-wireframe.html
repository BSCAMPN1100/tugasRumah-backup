<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wireframe - Data Barang</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;

            display: flex;
            justify-content: center;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: 100%;
            max-width: 500px;
            min-height: 100vh;

            background: white;
            border: 2px solid #333;

            padding: 20px;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            display: flex;
            align-items: center;

            border-bottom: 2px solid #333;

            padding-bottom: 18px;
            margin-bottom: 25px;
        }

        .back-button {
            font-size: 22px;
            margin-right: 15px;

            border: none;
            background: none;

            cursor: pointer;
        }

        .header h1 {
            font-size: 22px;
        }

        /* =========================
           TAMBAH BARANG
        ========================= */

        .add-button {
            width: 100%;
            height: 50px;

            border: 2px solid #333;
            background: #eee;

            font-weight: bold;
            cursor: pointer;

            margin-bottom: 20px;
        }

        .add-button:hover {
            background: #ddd;
        }

        /* =========================
           SEARCH
        ========================= */

        .search-box {
            width: 100%;
            height: 45px;

            border: 2px solid #333;

            padding: 0 15px;

            font-size: 14px;

            margin-bottom: 25px;
        }

        /* =========================
           JUDUL
        ========================= */

        .section-title {
            font-size: 16px;
            font-weight: bold;

            margin-bottom: 15px;
        }

        /* =========================
           CARD BARANG
        ========================= */

        .barang-card {
            border: 2px solid #333;

            padding: 18px;

            margin-bottom: 15px;
        }

        .barang-name {
            font-size: 18px;
            font-weight: bold;

            margin-bottom: 15px;
        }

        .barang-info {
            font-size: 14px;
            line-height: 1.8;
        }

        /* =========================
           ACTION BUTTON
        ========================= */

        .actions {
            display: flex;
            gap: 10px;

            margin-top: 15px;
        }

        .actions button {
            flex: 1;

            height: 40px;

            border: 2px solid #333;
            background: white;

            font-weight: bold;

            cursor: pointer;
        }

        .actions button:hover {
            background: #eee;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 500px) {

            .container {
                border: none;
            }

        }
    </style>
</head>

<body>

    <main class="container">

        <!-- HEADER -->
        <header class="header">

            <button class="back-button">
                ←
            </button>

            <h1>DATA BARANG</h1>

        </header>


        <!-- TAMBAH BARANG -->
        <button class="add-button">
            + TAMBAH BARANG
        </button>


        <!-- SEARCH -->
        <input
            type="text"
            class="search-box"
            placeholder="🔍 Cari nama barang..."
        >


        <!-- DAFTAR BARANG -->
        <h2 class="section-title">
            DAFTAR BARANG
        </h2>


        <!-- BARANG 1 -->
        <div class="barang-card">

            <div class="barang-name">
                Gula Pasir
            </div>

            <div class="barang-info">

                <p>
                    <strong>Stok:</strong>
                    100 kg
                </p>

                <p>
                    <strong>Harga Modal:</strong>
                    Rp10.000/kg
                </p>

                <p>
                    <strong>Harga Jual:</strong>
                    Rp12.000/kg
                </p>

            </div>


            <div class="actions">

                <button>
                    UBAH
                </button>

                <button>
                    HAPUS
                </button>

            </div>

        </div>


        <!-- BARANG 2 -->
        <div class="barang-card">

            <div class="barang-name">
                Minyak Goreng
            </div>

            <div class="barang-info">

                <p>
                    <strong>Stok:</strong>
                    50 liter
                </p>

                <p>
                    <strong>Harga Modal:</strong>
                    Rp12.000/liter
                </p>

                <p>
                    <strong>Harga Jual:</strong>
                    Rp14.000/liter
                </p>

            </div>


            <div class="actions">

                <button>
                    UBAH
                </button>

                <button>
                    HAPUS
                </button>

            </div>

        </div>

    </main>

</body>
</html>
