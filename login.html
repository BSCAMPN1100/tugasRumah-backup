<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wireframe - Login CatatRezekimu</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        /* =========================
           CONTAINER WIREFRAME
        ========================= */
        .login-container {
            width: 100%;
            max-width: 420px;
            min-height: 650px;

            background: white;

            border: 2px solid #333;

            padding: 40px 30px;

            display: flex;
            flex-direction: column;
        }

        /* =========================
           HEADER
        ========================= */
        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 28px;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .header p {
            font-size: 14px;
            color: #555;
        }

        /* =========================
           FORM
        ========================= */
        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            height: 50px;

            border: 2px solid #333;

            padding: 0 15px;

            font-size: 14px;
        }

        /* =========================
           LOGIN BUTTON
        ========================= */
        .login-button {
            width: 200px;
            height: 50px;

            margin: 15px auto 0;

            border: 2px solid #333;
            background: #eee;

            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background: #ddd;
        }

        /* =========================
           FOOTER
        ========================= */
        .footer {
            margin-top: auto;

            text-align: center;

            font-size: 13px;
            color: #666;
        }

        /* =========================
           RESPONSIVE
        ========================= */
        @media (max-width: 480px) {

            .login-container {
                min-height: 100vh;

                border: none;

                padding: 40px 25px;
            }

        }
    </style>
</head>

<body>

    <!-- =========================
         HALAMAN LOGIN
    ========================= -->
    <main class="login-container">

        <!-- HEADER -->
        <header class="header">
            <h1>CATATREZEKIMU</h1>

            <p>
                Aplikasi Manajemen Sembako
            </p>
        </header>


        <!-- FORM LOGIN -->
        <form>

            <!-- USERNAME -->
            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Masukkan username"
                >

            </div>


            <!-- PASSWORD -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Masukkan password"
                >

            </div>


            <!-- LOGIN -->
            <button
                type="submit"
                class="login-button">
                LOGIN
            </button>

        </form>


        <!-- FOOTER -->
        <footer class="footer">
            CatatRezekimu v1.0
        </footer>

    </main>

</body>
</html>
