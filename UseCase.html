<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Use Case Diagram - Rapi</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #eef3f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 20px;
        }
        .diagram-wrapper {
            background: white;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0,20,40,0.15);
            padding: 24px 20px 10px;
            max-width: 1100px;
            width: 100%;
            overflow-x: auto;
        }
        svg {
            display: block;
            width: 100%;
            height: auto;
            background: #fbfdff;
            border-radius: 16px;
        }
        .title {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: #0b2a44;
            padding-bottom: 8px;
            letter-spacing: -0.2px;
        }
        .title small {
            font-weight: 400;
            font-size: 15px;
            color: #4b6a8a;
            background: #e9edf4;
            padding: 2px 16px;
            border-radius: 30px;
            margin-left: 10px;
        }
        .legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px 30px;
            font-size: 13px;
            color: #1d3b58;
            padding-top: 12px;
            border-top: 1px solid #dce5ef;
            margin-top: 6px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .legend-line {
            width: 28px;
            height: 2px;
            background: #1f4b72;
            position: relative;
        }
        .legend-line::after {
            content: '▶';
            position: absolute;
            right: -14px;
            top: -8px;
            font-size: 12px;
            color: #1f4b72;
        }
        .legend-line.dashed {
            border-top: 2px dashed #d35400;
            background: none;
            height: 0;
        }
        .legend-line.dashed::after {
            content: '◀';
            right: auto;
            left: -14px;
            top: -8px;
            color: #d35400;
        }
        .legend-label {
            background: #eef3f9;
            padding: 1px 10px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            color: #1f3b57;
        }
    </style>
</head>
<body>
<div class="diagram-wrapper">
    <div class="title">
        📋 Use Case Diagram
        <small>Sistem Catatan &amp; Penjualan</small>
    </div>

    <svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, sans-serif">
        <defs>
            <!-- Panah solid -->
            <marker id="arrowSolid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 Z" fill="#1f4b72" />
            </marker>
            <!-- Panah include (oranye) -->
            <marker id="arrowInclude" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 Z" fill="#d35400" />
            </marker>
        </defs>

        <!-- ===== AKTOR ===== -->

        <!-- Admin (kiri atas) -->
        <circle cx="120" cy="120" r="18" fill="#e74c3c" stroke="#1f4b72" stroke-width="2" />
        <line x1="120" y1="138" x2="120" y2="180" stroke="#1f4b72" stroke-width="2.5" />
        <line x1="100" y1="156" x2="140" y2="156" stroke="#1f4b72" stroke-width="2.5" />
        <line x1="120" y1="180" x2="102" y2="206" stroke="#1f4b72" stroke-width="2.5" />
        <line x1="120" y1="180" x2="138" y2="206" stroke="#1f4b72" stroke-width="2.5" />
        <text x="120" y="230" text-anchor="middle" font-weight="bold" font-size="16" fill="#0b2a44">Admin</text>

        <!-- Karyawan / Kasir (kanan atas) -->
        <circle cx="800" cy="120" r="18" fill="#2ecc71" stroke="#1f4b72" stroke-width="2" />
        <line x1="800" y1="138" x2="800" y2="180" stroke="#1f4b72" stroke-width="2.5" />
        <line x1="780" y1="156" x2="820" y2="156" stroke="#1f4b72" stroke-width="2.5" />
        <line x1="800" y1="180" x2="782" y2="206" stroke="#1f4b72" stroke-width="2.5" />
        <line x1="800" y1="180" x2="818" y2="206" stroke="#1f4b72" stroke-width="2.5" />
        <text x="800" y="230" text-anchor="middle" font-weight="bold" font-size="16" fill="#0b2a44">Karyawan / Kasir</text>

        <!-- Tamu (bawah karyawan) -->
        <circle cx="800" cy="470" r="18" fill="#3498db" stroke="#1f4b72" stroke-width="2" />
        <line x1="800" y1="488" x2="800" y2="530" stroke="#1f4b72" stroke-width="2.5" />
        <line x1="780" y1="506" x2="820" y2="506" stroke="#1f4b72" stroke-width="2.5" />
        <line x1="800" y1="530" x2="782" y2="556" stroke="#1f4b72" stroke-width="2.5" />
        <line x1="800" y1="530" x2="818" y2="556" stroke="#1f4b72" stroke-width="2.5" />
        <text x="800" y="580" text-anchor="middle" font-weight="bold" font-size="16" fill="#0b2a44">Tamu</text>

        <!-- ===== USE CASE ===== -->

        <!-- Login (tengah bawah) -->
        <ellipse cx="500" cy="620" rx="90" ry="38" fill="#f9e79f" stroke="#1f4b72" stroke-width="3" />
        <text x="500" y="628" text-anchor="middle" font-weight="bold" font-size="20" fill="#0b2a44">Login</text>

        <!-- Use case Admin -->
        <ellipse cx="320" cy="90" rx="115" ry="30" fill="#ebf3fa" stroke="#1f4b72" stroke-width="2" />
        <text x="320" y="96" text-anchor="middle" font-size="14" fill="#0b2a44">Kelola data Barang</text>

        <ellipse cx="480" cy="90" rx="110" ry="30" fill="#ebf3fa" stroke="#1f4b72" stroke-width="2" />
        <text x="480" y="96" text-anchor="middle" font-size="14" fill="#0b2a44">Catat penjualan</text>

        <ellipse cx="320" cy="180" rx="115" ry="30" fill="#ebf3fa" stroke="#1f4b72" stroke-width="2" />
        <text x="320" y="186" text-anchor="middle" font-size="14" fill="#0b2a44">Lakukan opname stock</text>

        <ellipse cx="320" cy="270" rx="115" ry="30" fill="#ebf3fa" stroke="#1f4b72" stroke-width="2" />
        <text x="320" y="276" text-anchor="middle" font-size="14" fill="#0b2a44">Lihat Laporan keuangan</text>

        <!-- Use case Karyawan -->
        <ellipse cx="640" cy="180" rx="110" ry="30" fill="#ebf3fa" stroke="#1f4b72" stroke-width="2" />
        <text x="640" y="186" text-anchor="middle" font-size="14" fill="#0b2a44">Lihat Riwayat</text>

        <!-- Use case Tamu (tanpa include) -->
        <ellipse cx="640" cy="430" rx="115" ry="30" fill="#ebf3fa" stroke="#1f4b72" stroke-width="2" />
        <text x="640" y="436" text-anchor="middle" font-size="14" fill="#0b2a44">Buat catatan Baru</text>

        <ellipse cx="640" cy="510" rx="115" ry="30" fill="#ebf3fa" stroke="#1f4b72" stroke-width="2" />
        <text x="640" y="516" text-anchor="middle" font-size="14" fill="#0b2a44">Lihat daftar catatan</text>

        <!-- ===== GARIS AKTOR → USE CASE (solid) ===== -->

        <!-- Admin → Kelola data Barang -->
        <line x1="160" y1="120" x2="205" y2="90" stroke="#1f4b72" stroke-width="2" marker-end="url(#arrowSolid)" />
        <!-- Admin → Catat penjualan (shared) -->
        <line x1="160" y1="120" x2="370" y2="90" stroke="#1f4b72" stroke-width="2" marker-end="url(#arrowSolid)" />
        <!-- Admin → Opname stock -->
        <line x1="160" y1="120" x2="205" y2="180" stroke="#1f4b72" stroke-width="2" marker-end="url(#arrowSolid)" />
        <!-- Admin → Laporan keuangan -->
        <line x1="160" y1="120" x2="205" y2="270" stroke="#1f4b72" stroke-width="2" marker-end="url(#arrowSolid)" />

        <!-- Karyawan → Catat penjualan (shared) -->
        <line x1="740" y1="120" x2="590" y2="90" stroke="#1f4b72" stroke-width="2" marker-end="url(#arrowSolid)" />
        <!-- Karyawan → Lihat Riwayat -->
        <line x1="740" y1="120" x2="750" y2="180" stroke="#1f4b72" stroke-width="2" marker-end="url(#arrowSolid)" />

        <!-- Tamu → Buat catatan Baru -->
        <line x1="740" y1="470" x2="755" y2="430" stroke="#1f4b72" stroke-width="2" marker-end="url(#arrowSolid)" />
        <!-- Tamu → Lihat daftar catatan -->
        <line x1="740" y1="470" x2="755" y2="510" stroke="#1f4b72" stroke-width="2" marker-end="url(#arrowSolid)" />

        <!-- ===== GARIS INCLUDE (putus-putus) DARI USE CASE KE LOGIN ===== -->
        <!-- Hanya untuk use case yang memerlukan login: semua kecuali milik Tamu -->

        <!-- Kelola data Barang → Login -->
        <line x1="320" y1="120" x2="410" y2="585" stroke="#d35400" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrowInclude)" />
        <text x="350" y="360" fill="#d35400" font-size="12" font-weight="bold" transform="rotate(-20,350,360)">&lt;&lt;include&gt;&gt;</text>

        <!-- Catat penjualan → Login -->
        <line x1="480" y1="120" x2="500" y2="582" stroke="#d35400" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrowInclude)" />
        <text x="490" y="350" fill="#d35400" font-size="12" font-weight="bold" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

        <!-- Opname stock → Login -->
        <line x1="320" y1="210" x2="410" y2="585" stroke="#d35400" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrowInclude)" />
        <text x="350" y="400" fill="#d35400" font-size="12" font-weight="bold" transform="rotate(-18,350,400)">&lt;&lt;include&gt;&gt;</text>

        <!-- Laporan keuangan → Login -->
        <line x1="320" y1="300" x2="410" y2="585" stroke="#d35400" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrowInclude)" />
        <text x="350" y="440" fill="#d35400" font-size="12" font-weight="bold" transform="rotate(-15,350,440)">&lt;&lt;include&gt;&gt;</text>

        <!-- Lihat Riwayat → Login -->
        <line x1="640" y1="210" x2="560" y2="585" stroke="#d35400" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrowInclude)" />
        <text x="620" y="400" fill="#d35400" font-size="12" font-weight="bold" transform="rotate(15,620,400)">&lt;&lt;include&gt;&gt;</text>

        <!-- Catatan: Use case Tamu tidak ada panah ke Login -->

    </svg>

    <div class="legend">
        <span class="legend-item">
            <span class="legend-line"></span> Asosiasi
        </span>
        <span class="legend-item">
            <span class="legend-line dashed"></span>
            <span class="legend-label">&lt;&lt;include&gt;&gt;</span> memerlukan Login
        </span>
        <span class="legend-item">
            <span style="background:#f9e79f; padding:0 12px; border-radius:20px; border:2px solid #1f4b72;">Login</span> Use case pusat
        </span>
    </div>
</div>
</body>
</html>
